version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: universal-pos-db
    environment:
      POSTGRES_DB: universal_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: universal-pos-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: universal_pos
      DB_USER: postgres
      DB_PASSWORD: postgres123
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: your_super_secret_jwt_key_change_this
      STRIPE_SECRET_KEY: sk_test_your_key
      EXCHANGE_RATE_API_KEY: your_api_key
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-network
    restart: unless-stopped

  web:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
    container_name: universal-pos-web
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - api
    networks:
      - pos-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  pos-network:
    driver: bridge
